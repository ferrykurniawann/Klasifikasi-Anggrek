<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Prediksi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #2d3436;
            font-size: 26px;
            text-align: center;
            margin-bottom: 24px;
        }
        .empty {
            text-align: center;
            color: #b2bec3;
            padding: 40px;
            font-size: 16px;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border: 1px solid #f1f2f6;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: box-shadow 0.3s;
        }
        .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .card img {
            width: 72px;
            height: 72px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .card-body { flex: 1; }
        .card-label {
            font-size: 18px;
            font-weight: 700;
            color: #6c5ce7;
        }
        .card-info {
            font-size: 13px;
            color: #636e72;
            margin-top: 4px;
        }
        .card-confidence {
            text-align: right;
            flex-shrink: 0;
        }
        .card-confidence .val {
            font-size: 20px;
            font-weight: 700;
            color: #00b894;
        }
        .card-confidence .lbl {
            font-size: 12px;
            color: #b2bec3;
        }
        .btn-back {
            display: block;
            text-align: center;
            background: #dfe6e9;
            color: #2d3436;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 24px;
            transition: background 0.3s;
        }
        .btn-back:hover { background: #b2bec3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>&#128196; Riwayat Prediksi</h1>
        {% if history %}
            {% for entry in history %}
            <div class="card">
                <img src="/uploads/{{ entry.filename }}"
                     alt="{{ entry.filename }}">
                <div class="card-body">
                    <div class="card-label">{{ entry.label }}</div>
                    <div class="card-info">{{ entry.filename }} &middot; {{ entry.timestamp }}</div>
                </div>
                <div class="card-confidence">
                    <div class="val">{{ "%.1f"|format(entry.confidence * 100) }}%</div>
                    <div class="lbl">keyakinan</div>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div class="empty">Belum ada riwayat prediksi.</div>
        {% endif %}
        <a href="/" class="btn-back">&#8592; Kembali</a>
    </div>
</body>
</html>
