<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasifikasi Anggrek</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 560px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #2d3436;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #636e72;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .upload-area {
            border: 2px dashed #b2bec3;
            border-radius: 12px;
            padding: 40px 20px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .upload-area:hover { border-color: #6c5ce7; background: #f0edff; }
        .upload-area.dragover { border-color: #6c5ce7; background: #e8e3ff; }
        .upload-icon { font-size: 48px; color: #6c5ce7; margin-bottom: 12px; }
        .upload-text { color: #2d3436; font-size: 16px; font-weight: 600; }
        .upload-hint { color: #b2bec3; font-size: 13px; margin-top: 8px; }
        input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }
        #preview {
            max-width: 100%; max-height: 280px; margin-top: 16px;
            border-radius: 8px; display: none; object-fit: contain;
        }
        .btn-predict {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
            width: 100%;
        }
        .btn-predict:hover { background: #5a4bd1; }
        .btn-predict:disabled { background: #b2bec3; cursor: not-allowed; }
        .flash {
            background: #ffeaa7;
            color: #2d3436;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .btn-history {
            display: inline-block;
            margin-top: 16px;
            color: #6c5ce7;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 20px;
            border: 2px solid #6c5ce7;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .btn-history:hover { background: #6c5ce7; color: white; }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #b2bec3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>&#127800; Klasifikasi Anggrek</h1>
        <p class="subtitle">Unggah gambar anggrek untuk dikenali jenisnya</p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
        {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data" id="uploadForm">
            <div class="upload-area" id="dropZone">
                <div class="upload-icon">&#128247;</div>
                <div class="upload-text">Klik atau tarik gambar ke sini</div>
                <div class="upload-hint">PNG, JPG, JPEG, BMP, TIFF</div>
                <input type="file" name="file" id="fileInput" accept="image/*" required>
            </div>
            <img id="preview" alt="Preview">
            <button type="submit" class="btn-predict" id="btnSubmit" disabled>
                &#128269; Prediksi
            </button>
        </form>
        <a href="/history" class="btn-history">&#128196; Riwayat Prediksi</a>
        <div class="footer">Model: MobileNetV2 &middot; 5 Jenis Anggrek</div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const btnSubmit = document.getElementById('btnSubmit');
        const dropZone = document.getElementById('dropZone');

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    btnSubmit.disabled = false;
                };
                reader.readAsDataURL(file);
            }
        });

        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', function() {
            this.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                const event = new Event('change');
                fileInput.dispatchEvent(event);
            }
        });
    </script>
</body>
</html>
